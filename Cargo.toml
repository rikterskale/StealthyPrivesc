[workspace]
resolver = "2"
members = ["crates/stealthy"]
default-members = ["crates/stealthy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Authorized Red Team Operators"]
repository = "https://github.com/rikterskale/StealthyPrivesc"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
