name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check patch whitespace
        run: git diff --check

      - name: Validate Markdown files and local links
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys
          from urllib.parse import unquote, urlparse

          root = Path.cwd()
          markdown = sorted(root.rglob("*.md"))
          assert markdown, "No Markdown documentation found"
          failures = []
          link_pattern = re.compile(r"!?\[[^]]*\]\(([^)]+)\)")

          for path in markdown:
              if not path.read_text(encoding="utf-8").strip():
                  failures.append(f"{path}: empty Markdown file")
              for raw_target in link_pattern.findall(path.read_text(encoding="utf-8")):
                  target = raw_target.strip().split()[0].strip("<>")
                  parsed = urlparse(target)
                  if parsed.scheme or target.startswith("#"):
                      continue
                  local = unquote(parsed.path)
                  if not local:
                      continue
                  candidate = (path.parent / local).resolve()
                  try:
                      candidate.relative_to(root.resolve())
                  except ValueError:
                      failures.append(f"{path}: link escapes repository: {target}")
                      continue
                  if not candidate.exists():
                      failures.append(f"{path}: missing local link target: {target}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print(f"Validated {len(markdown)} Markdown files")

      - name: Enforce document contract
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          root = Path.cwd()
          failures = []
          markdown = sorted(root.rglob('*.md'))

          required_sections = {
              Path('docs/design.md'): [
                  '# StealthyPrivesc Design',
                  '## Overview',
                  '## Goals & Non-Goals',
                  '## Key Decisions',
                  '## Current architecture',
                  '## Security & Privacy Considerations',
                  '## Risks',
                  '## Maintenance and delivery plan',
              ],
              Path('docs/capabilities.md'): [
                  '# StealthyPrivesc Capabilities',
                  '## Capability status',
                  '## Initial MVP capabilities',
                  '## Implemented command surface',
                  '## Artifact workflow',
                  '## Security, privacy, and operational controls',
                  '## Explicitly out of scope for v1',
              ],
              Path('docs/first-user-journey.md'): [
                  '# First-User Journey',
                  '## Goals',
                  '## Entry points',
                  '## Journey stages',
                  '## Non-interactive contract',
                  '## CI contract',
                  '## Safety boundary',
              ],
          }

          for path in markdown:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError as exc:
                  failures.append(f'{path}: not valid UTF-8 ({exc})')
                  continue
              if not text.strip():
                  failures.append(f'{path}: document is empty')
                  continue
              if not re.search(r'^#\s+\S+', text, re.MULTILINE):
                  failures.append(f'{path}: missing top-level Markdown heading')
              if text.count('```') % 2:
                  failures.append(f'{path}: unbalanced fenced code block')
              if '\t' in text:
                  failures.append(f'{path}: tab characters are not allowed in Markdown')
              for line_number, line in enumerate(text.splitlines(), 1):
                  trailing = line[len(line.rstrip(' \t')):]
                  if trailing and trailing != '  ':
                      failures.append(f'{path}:{line_number}: trailing whitespace found')

          for path, sections in required_sections.items():
              if not path.exists():
                  failures.append(f'{path}: required document is missing')
                  continue
              text = path.read_text(encoding='utf-8')
              for section in sections:
                  if section not in text:
                      failures.append(f'{path}: required section missing: {section}')

          capabilities = root / 'docs' / 'capabilities.md'
          if capabilities.exists():
              capabilities_text = capabilities.read_text(encoding='utf-8')
              if '[`docs/design.md`](design.md)' not in capabilities_text:
                  failures.append('docs/capabilities.md: must link to the source design')
              if '[`docs/first-user-journey.md`](first-user-journey.md)' not in capabilities_text:
                  failures.append('docs/capabilities.md: must link to the first-user journey contract')

          if failures:
              print(*failures, sep='\n')
              sys.exit(1)
          print(f'Document contract passed for {len(markdown)} Markdown files')

      - name: Enforce pinned GitHub Actions
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          pattern = re.compile(r"^\s*uses:\s*[^@]+@([^\s#]+)")
          refs = []
          for path in Path(".github/workflows").glob("*.yml"):
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = pattern.match(line)
                  if match:
                      refs.append((path, line_number, match.group(1)))
          invalid = [item for item in refs if not re.fullmatch(r"[0-9a-f]{40}", item[2])]
          if invalid:
              print("Unpinned actions:", *invalid, sep="\n")
              sys.exit(1)
          assert refs, "No GitHub Actions found"
          print(f"Validated {len(refs)} pinned actions")

      - name: Validate production-readiness acceptance criteria
        run: |
          python3 scripts/ci/validate_windows_contract.py
          python3 scripts/ci/validate_production_readiness.py
          python3 scripts/ci/validate_operations_contract.py
          python3 scripts/ci/validate_installer_contract.py
          python3 scripts/ci/validate_html_report.py

  rust:
    name: Rust core checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy with default features
        run: cargo clippy --locked -p stealthy --all-targets -- -D warnings

      - name: Test with default features
        run: cargo test --locked -p stealthy

      - name: Release build with default features
        run: cargo build --locked -p stealthy --release

      - name: Validate report compatibility and malformed inputs
        run: python3 scripts/ci/validate_report_compatibility.py ./target/release/stealthy

      - name: Validate plugin test and documentation matrix
        run: python3 scripts/ci/validate_plugin_matrix.py

      - name: Check, lint, and test enum-only flavor
        run: |
          cargo check --locked -p stealthy --profile enum-only --no-default-features --features enum-only
          cargo clippy --locked -p stealthy --profile enum-only --no-default-features --features enum-only --all-targets -- -D warnings
          cargo test --locked -p stealthy --profile enum-only --no-default-features --features enum-only

      - name: Check, lint, and test opsec-string-strip flavor
        run: |
          cargo check --locked -p stealthy --profile opsec-string-strip --no-default-features --features opsec-string-strip
          cargo clippy --locked -p stealthy --profile opsec-string-strip --no-default-features --features opsec-string-strip --all-targets -- -D warnings
          cargo test --locked -p stealthy --profile opsec-string-strip --no-default-features --features opsec-string-strip
          cargo build --locked -p stealthy --profile opsec-string-strip --no-default-features --features opsec-string-strip
          bin=target/opsec-string-strip/stealthy
          "$bin" disclaimer | grep -qi authorized
          set +e
          "$bin" enum >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          "$bin" --authorized --quiet --format json enum --plugins linux.kernel_cve |
            python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["authorized_use_ack"] is True and r["run_id"] and r["mode"] == "enumerate-only"'

      - name: CLI smoke
        run: |
          set -euo pipefail
          bin=./target/release/stealthy
          "$bin" guide
          "$bin" disclaimer
          "$bin" --help
          if "$bin" enum; then echo 'expected auth failure' >&2; exit 1; fi
          "$bin" --authorized list-plugins
          "$bin" --authorized --no-color enum --plugins linux.kernel_cve --min-severity info > /tmp/stealthy-human-report.txt
          test -s /tmp/stealthy-human-report.txt
          "$bin" --authorized --format json -q enum --plugins linux.kernel_cve | python -c 'import json,sys; json.load(sys.stdin)'

  linux-distributions:
    name: Linux distribution runtime (${{ matrix.distribution }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: ubuntu-22.04
            image: ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc
          - distribution: ubuntu-24.04
            image: ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
          - distribution: debian-12
            image: debian@sha256:813017f3d62be4b5891a7acca6a01bdcd4b8513daa81b1ab99d3a50385b26931
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build and smoke-test in ${{ matrix.distribution }}
        shell: bash
        # Contract marker: coverage_mode'] == 'native'
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl build-essential python3 bash perl
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              cargo metadata --locked --format-version 1 --no-deps >/dev/null
              cargo test --locked --workspace
              cargo build --locked -p stealthy --release
              ./target/release/stealthy doctor --json
              ./target/release/stealthy --authorized --quiet --format json enum --plugins linux.kernel_cve |
                python3 -c "import json,sys; r=json.load(sys.stdin); assert r[\"coverage_mode\"] == \"native\"; assert r[\"authorized_use_ack\"] is True"
            '

  ux:
    name: Release CLI user-experience contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Build release binary
        run: cargo build --locked -p stealthy --release

      - name: Exercise end-to-end CLI UX contract
        shell: python
        run: |
          import json
          import os
          import stat
          import subprocess
          import tempfile
          from pathlib import Path

          binary = str(Path("target/release/stealthy").resolve())

          def run(*args, expected=0, cwd=None):
              result = subprocess.run(
                  [binary, *args], capture_output=True, text=True, timeout=30, cwd=cwd
              )
              if result.returncode != expected:
                  raise AssertionError(
                      f"{args}: expected exit {expected}, got {result.returncode}\n"
                      f"stdout={result.stdout}\nstderr={result.stderr}"
                  )
              return result

          for command, marker in (("guide", "operator guide"), ("disclaimer", "authorized")):
              assert marker in run(command).stdout.lower()
          assert "usage" in run("--help").stdout.lower()

          unauthorized = run("enum", expected=2)
          assert "authorization required" in unauthorized.stderr.lower()

          doctor = json.loads(run("doctor", "--json").stdout)
          assert doctor["schema_version"] == "1"
          assert doctor["healthy"] is True
          assert doctor["checks"]["plugins_available"] is True

          listing = run("--authorized", "list-plugins", "--tsv").stdout.strip().splitlines()
          assert listing and all(len(line.split("\t")) == 3 for line in listing)
          plugin_ids = [line.split("\t", 1)[0] for line in listing]
          assert len(plugin_ids) == len(set(plugin_ids))
          assert all(plugin_id and " " not in plugin_id for plugin_id in plugin_ids)

          version = run("--version").stdout.strip()
          assert version.startswith("stealthy ") and version.split(" ", 1)[1]

          unknown = run(
              "--authorized", "--quiet", "enum", "--plugins", "not.a.real.plugin", expected=1
          )
          assert "unknown plugin id" in unknown.stderr.lower()
          assert "list-plugins" in unknown.stderr

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              json_reports = []
              for name in ("baseline.json", "current.json"):
                  report = root / name
                  result = run(
                      "--authorized", "--quiet", "--format", "json", "enum",
                      "--plugins", "linux.kernel_cve"
                  )
                  report.write_text(result.stdout, encoding="utf-8")
                  json_reports.append(report)
                  parsed = json.loads(result.stdout)
                  assert parsed["schema_version"] == "2"
                  assert isinstance(parsed["run_id"], str) and parsed["run_id"]
                  assert isinstance(parsed["started_at_unix"], int)
                  assert parsed["authorized_use_ack"] is True
                  assert parsed["mode"] == "enumerate-only"
                  assert isinstance(parsed["plugins_run"], list) and parsed["plugins_run"]
                  assert parsed["identity"]["elevation_source"]
                  assert len(parsed["assessments"]) == len(parsed["findings"])
                  assert all(isinstance(item["duration_ms"], int) and item["duration_ms"] >= 0
                             for item in parsed["coverage"])
                  assert all(
                      {"plugin", "kind", "severity", "title", "detail", "recommendation",
                       "noisy", "leaves_artifacts"} <= set(item)
                      for item in parsed["findings"]
                  )

              diff = json.loads(run("diff", *(str(path) for path in json_reports)).stdout)
              assert not diff["added"] and not diff["removed"] and not diff["changed"]

              markdown = run(
                  "--authorized", "--quiet", "--format", "markdown", "enum",
                  "--plugins", "linux.kernel_cve"
              ).stdout
              assert markdown.startswith("# StealthyPrivesc report")
              assert "Plugin coverage" in markdown

              sarif = json.loads(run(
                  "--authorized", "--quiet", "--format", "sarif", "enum",
                  "--plugins", "linux.kernel_cve"
              ).stdout)
              assert sarif["version"] == "2.1.0"
              assert sarif["runs"][0]["properties"]["run_id"]

              sealed = root / "findings.seal"
              sealed_key = root / "findings.key"
              run(
                  "--authorized", "--quiet", "--output", "file",
                  "--output-path", str(sealed), "--key-output-path", str(sealed_key),
                  "enum", "--plugins", "linux.kernel_cve"
              )
              assert sealed.is_file() and sealed.stat().st_size > 0 and sealed_key.is_file()
              if os.name == "posix":
                  assert stat.S_IMODE(sealed.stat().st_mode) == 0o600
                  assert stat.S_IMODE(sealed_key.stat().st_mode) == 0o600
              bad_key = run(
                  "report", str(sealed), "--key-hex", "00" * 32, expected=1
              )
              assert "authentication" in bad_key.stderr.lower()

              sealed_verbose = root / "verbose.seal"
              verbose_key = root / "verbose.key"
              verbose = run(
                  "--authorized", "--verbose", "--output", "file",
                  "--output-path", str(sealed_verbose), "--key-output-path", str(verbose_key),
                  "enum", "--plugins", "linux.kernel_cve"
              )
              assert "decrypt key" not in verbose.stderr.lower()
              key = verbose_key.read_text(encoding="utf-8").strip()
              assert len(key) == 64
              reopened = json.loads(run(
                  "report", str(sealed_verbose), "--key-file", str(verbose_key),
                  "--format", "json"
              ).stdout)
              assert reopened["schema_version"] == "2"
              assert reopened["findings"]
              reopened_sarif = json.loads(run(
                  "report", str(sealed_verbose), "--key-file", str(verbose_key),
                  "--format", "sarif"
              ).stdout)
              assert reopened_sarif["version"] == "2.1.0"

              sidecar_seal = root / "sidecar.seal"
              sidecar_key = root / "sidecar.key"
              run(
                  "--authorized", "--quiet", "--output", "file",
                  "--output-path", str(sidecar_seal), "--key-output-path", str(sidecar_key),
                  "--also-markdown",
                  "enum", "--plugins", "linux.kernel_cve"
              )
              sidecar = Path(str(sidecar_seal) + ".md")
              assert sidecar.is_file()
              assert sidecar.read_text(encoding="utf-8").startswith("# StealthyPrivesc report")

              plaintext = root / "findings.json"
              run(
                  "--authorized", "--quiet", "--output", "file",
                  "--plaintext-file", "--output-path", str(plaintext),
                  "enum", "--plugins", "linux.kernel_cve"
              )
              assert json.loads(plaintext.read_text(encoding="utf-8"))["schema_version"] == "2"
              if os.name == "posix":
                  assert stat.S_IMODE(plaintext.stat().st_mode) == 0o600

              before = sorted(root.iterdir())
              memory_root = root / "memory-only"
              memory_root.mkdir()
              run(
                  "--authorized", "--quiet", "enum", "--plugins", "linux.kernel_cve",
                  cwd=memory_root,
              )
              assert not (memory_root / ".cache-run").exists()
              assert set(root.iterdir()) == set(before) | {memory_root}

          missing_path = run("--authorized", "--quiet", "--output", "file", expected=1)
          assert "output=file requires --output-path" in missing_path.stderr
          remote_url = run("--authorized", "--quiet", "--output", "remote", expected=1)
          assert "requires --exfil-url" in remote_url.stderr
          plaintext_without_file = run(
              "--authorized", "--quiet", "--plaintext-file", "enum",
              "--plugins", "linux.kernel_cve", expected=1
          )
          assert "output=file" in plaintext_without_file.stderr
          markdown_without_file = run(
              "--authorized", "--quiet", "--also-markdown", "enum",
              "--plugins", "linux.kernel_cve", expected=1
          )
          assert "output=file" in markdown_without_file.stderr
          missing_report = run(
              "report", "does-not-exist.seal", "--key-hex", "00", expected=1
          )
          assert missing_report.stderr.strip()
          assert run(
              "--authorized", "--quiet", "--fail-on", "info", "enum",
              "--plugins", "linux.kernel_cve", expected=4
          ).returncode == 4
          print("Release CLI UX contract passed")

  coverage:
    name: Rust code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COVERAGE_MIN_LINES: "80"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov --version 0.6.16

      - name: Generate LCOV coverage report
        run: |
          cargo llvm-cov --locked --workspace --all-targets --lcov \
            --output-path lcov.info
          python3 scripts/ci/generate_plugin_coverage.py lcov.info plugin-coverage.json
          cargo llvm-cov report --summary-only > coverage-summary.txt
          {
            echo '## Rust coverage summary'
            echo
            echo "Required line coverage: ${COVERAGE_MIN_LINES}%"
            echo
            echo '```text'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --fail-under-lines "$COVERAGE_MIN_LINES"

      - name: Publish coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-lcov-${{ github.sha }}
          path: |
            lcov.info
            coverage-summary.txt
            plugin-coverage.json
          if-no-files-found: error
          retention-days: 14

  rust-windows:
    name: Rust Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps > $null

      - name: Exclude test temp paths from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:TEMP, (Resolve-Path .\target).Path, $PWD
            Write-Host "Configured Defender exclusions before Windows test fixtures"
          } catch {
            Write-Warning "Could not configure Defender exclusions before tests: $_"
          }

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy with default features
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test with default features
        run: cargo test --locked --workspace

      - name: Test all feature combinations
        run: cargo test --locked --workspace --all-features

      - name: Release build
        run: cargo build --locked --workspace --release

      - name: Native Windows ACL validation
        run: cargo test --locked --workspace native_acl_check_reports_missing_paths_as_unknown -- --nocapture

      - name: Windows Python fallback registry error states
        run: python scripts/ci/test_windows_enum.py

      - name: Windows CLI, PowerShell fallback, and bundle smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $bin = (Resolve-Path .\target\release\stealthy.exe).Path
          $doctor = & $bin doctor --json | ConvertFrom-Json
          if ($doctor.schema_version -ne '1' -or -not $doctor.healthy) { throw 'doctor smoke failed' }

          $unauthorized = Start-Process -FilePath $bin -ArgumentList @('enum') -Wait -PassThru -NoNewWindow
          if ($unauthorized.ExitCode -ne 2) { throw "expected auth exit 2, got $($unauthorized.ExitCode)" }

          $fallbackUnauthorized = Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile', '-File', '.\scripts\windows\enum.ps1', '-Json') -Wait -PassThru -NoNewWindow
          if ($fallbackUnauthorized.ExitCode -ne 2) { throw "expected fallback auth exit 2, got $($fallbackUnauthorized.ExitCode)" }

          $fallback = & powershell.exe -NoProfile -File .\scripts\windows\enum.ps1 -Authorized -Json | ConvertFrom-Json
          if ($fallback.coverage_mode -ne 'script') { throw 'PowerShell fallback coverage mode mismatch' }
          if ($fallback.mode -ne 'enumerate-only' -or $fallback.authorized_use_ack -ne $true) { throw 'PowerShell fallback safety metadata mismatch' }
          if ($fallback.capability_delta.Count -eq 0 -or $fallback.coverage -eq $null) { throw 'PowerShell fallback coverage metadata is incomplete' }
          $expectedDelta = @(
            'windows.services',
            'windows.scheduled_tasks',
            'windows.always_install_elevated',
            'windows.uac',
            'windows.dll_hijack',
            'windows.credentials',
            'windows.admin_sessions',
            'windows.env_path',
            'windows.autoruns',
            'windows.endpoint_controls',
            'windows.app_control'
          )
          $deltaDifference = @(Compare-Object $expectedDelta @($fallback.capability_delta))
          if ($fallback.capability_delta.Count -ne $expectedDelta.Count -or $deltaDifference.Count -ne 0) {
            throw 'PowerShell fallback capability delta mismatch'
          }

          # Stage under the workspace, not %TEMP%: Defender real-time scanning
          # often quarantines freshly copied unsigned PEs in TEMP before verify.
          $dispatcherEnvironmentNames = @(
            'STEALTHY_AUTHORIZED',
            'STEALTHY_MANIFEST_ROE_REF',
            'STEALTHY_EXECUTION_PATH',
            'STEALTHY_PRIMARY_LAUNCH'
          )
          $dispatcherEnvironment = @{}
          foreach ($name in $dispatcherEnvironmentNames) {
            $dispatcherEnvironment[$name] = [Environment]::GetEnvironmentVariable($name, 'Process')
          }
          function Assert-DispatcherEnvironmentRestored([string]$Scenario) {
            foreach ($name in $dispatcherEnvironmentNames) {
              $actual = [Environment]::GetEnvironmentVariable($name, 'Process')
              if ($actual -ne $dispatcherEnvironment[$name]) {
                throw "$Scenario dispatcher leaked process environment variable $name"
              }
            }
          }
          $root = Join-Path $PWD ('stealthy-smoke-' + [guid]::NewGuid().ToString('N'))
          $stage = Join-Path $root 'stage'
          $ledger = Join-Path $root 'ledger'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          try {
            Add-MpPreference -ExclusionPath $root
            $prefs = Get-MpPreference
            if ($prefs.ExclusionPath -notcontains $root) {
              throw "Defender ExclusionPath did not include $root after Add-MpPreference"
            }
          } catch {
            Write-Warning "Could not assert Defender path exclusion for $root : $_"
          }

          & $bin stage --os windows --target-hostname $env:COMPUTERNAME --out $stage --binary $bin --ledger-dir $ledger
          $stagedExe = Join-Path $stage 'stealthy.exe'
          $manifest = Get-Content -Raw (Join-Path $stage 'scripts\stealthy-run.conf')
          if ($manifest -notmatch 'windows_fallbacks=python,pwsh,powershell,git,jscript,msbuild') {
            throw 'staged manifest missing ordered windows_fallbacks default'
          }
          if (Test-Path -LiteralPath $stagedExe -PathType Leaf) {
            $sum = (Get-Content (Join-Path $stage 'SHA256SUMS')).Split()[0]
            & $bin verify --path $stagedExe --expect-sha256 $sum
            $native = & (Join-Path $stage 'scripts\run.ps1') --authorized --quiet --format=json enum --plugins windows.privileges | ConvertFrom-Json
            if ($native.coverage_mode -ne 'native') { throw 'native Windows bundle coverage mode mismatch' }
            if ($native.authorized_use_ack -ne $true -or $native.mode -ne 'enumerate-only') { throw 'native Windows safety metadata mismatch' }
          } else {
            throw 'native staged binary unavailable after write'
          }
          Assert-DispatcherEnvironmentRestored 'native'
          & $bin --ledger-dir $ledger cleanup --latest

          $fallbackRoot = Join-Path $root 'fallback'
          $fallbackLedger = Join-Path $root 'fallback-ledger'
          & $bin stage --os windows --target-hostname $env:COMPUTERNAME --out $fallbackRoot --name stealthy --ledger-dir $fallbackLedger
          $reduced = & (Join-Path $fallbackRoot 'scripts\run.ps1') --authorized --format=json enum | ConvertFrom-Json
          if ($reduced.coverage_mode -ne 'script') { throw 'dispatcher fallback coverage mode mismatch' }
          if ($reduced.primary_launch -ne 'not_applicable') { throw "script-only primary_launch mismatch: $($reduced.primary_launch)" }
          Assert-DispatcherEnvironmentRestored 'script-only'
          & $bin --ledger-dir $fallbackLedger cleanup --latest

          # Simulate AV quarantine: stage a real PE, delete it, expect script fallback.
          $qRoot = Join-Path $root 'quarantine-sim'
          $qLedger = Join-Path $root 'quarantine-ledger'
          & $bin stage --os windows --target-hostname $env:COMPUTERNAME --out $qRoot --binary $bin --ledger-dir $qLedger
          $qExe = Join-Path $qRoot 'stealthy.exe'
          if (Test-Path -LiteralPath $qExe -PathType Leaf) {
            Remove-Item -LiteralPath $qExe -Force
          } else {
            Write-Warning "Defender already quarantined $qExe — proceeding with fallback validation"
          }
          $qManifestPath = Join-Path $qRoot 'scripts\stealthy-run.conf'
          $qManifest = (Get-Content -Raw $qManifestPath) -replace '(?m)^primary_binary=.*$', 'primary_binary=quarantined-stealthy.exe'
          Set-Content -LiteralPath $qManifestPath -Value $qManifest -Encoding utf8
          if (Test-Path -LiteralPath (Join-Path $qRoot 'quarantined-stealthy.exe') -PathType Leaf) {
            throw 'quarantine-sim fixture unexpectedly contains its declared primary binary'
          }
          $qOutput = & (Join-Path $qRoot 'scripts\run.ps1') --authorized --format=json enum
          if ($LASTEXITCODE -ne 0) {
            throw "quarantine-sim script failed with exit $LASTEXITCODE"
          }
          try {
            $quarantined = $qOutput | ConvertFrom-Json
          } catch {
            throw "could not parse quarantine-sim output as JSON: $_"
          }
          if ($quarantined.coverage_mode -ne 'script') {
            throw "quarantine-sim coverage_mode: expected 'script', got '$($quarantined.coverage_mode)'"
          }
          if ($quarantined.primary_launch -ne 'blocked') {
            throw "quarantine-sim primary_launch: expected 'blocked', got '$($quarantined.primary_launch)'"
          }
          if ($quarantined.execution_path -ne 'powershell-fallback') {
            throw "quarantine-sim execution_path: expected 'powershell-fallback', got '$($quarantined.execution_path)'"
          }
          Assert-DispatcherEnvironmentRestored 'quarantine'
          & $bin --ledger-dir $qLedger cleanup --latest

          $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $jsUnauthorized = & cscript.exe //nologo .\scripts\windows\enum.js
            $jsUnauthorizedExit = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference
          }
          if ($jsUnauthorizedExit -ne 2) { throw "unauthorized JScript fallback exit mismatch: $jsUnauthorizedExit" }
          if (($jsUnauthorized -join "`n") -notmatch 'Authorization required') { throw 'unauthorized JScript fallback did not explain the authorization gate' }

          $jsOutput = & cscript.exe //nologo .\scripts\windows\enum.js --authorized --json
          if ($LASTEXITCODE -ne 0) { throw "JScript fallback failed with exit $LASTEXITCODE" }
          try {
            $js = $jsOutput | ConvertFrom-Json
          } catch {
            throw "could not parse JScript fallback output as JSON: $_"
          }
          if ($js.coverage_mode -ne 'script') { throw "JScript coverage_mode mismatch: $($js.coverage_mode)" }
          if ($js.authorized_use_ack -ne $true -or $js.mode -ne 'enumerate-only') { throw 'JScript safety metadata mismatch' }
          if ($js.identity.elevation_source -ne 'jscript') { throw "JScript elevation_source mismatch: $($js.identity.elevation_source)" }

          $handoff = & $bin --authorized --quiet --format json enum --plugins windows.privileges --allow-techniques potato,msi,credential-dump | ConvertFrom-Json
          $handoffFindings = @($handoff.findings | Where-Object { $_.plugin -eq 'allow_techniques' })
          if ($handoffFindings.Count -ne 3) { throw "expected 3 high-impact handoffs, got $($handoffFindings.Count)" }
          foreach ($finding in $handoffFindings) {
            if ($finding.kind -eq 'scaffold') { throw "high-impact family remained scaffolded: $($finding.technique_id)" }
            if (-not $finding.next_command -or $finding.next_command -notmatch '^stealthy --authorized') { throw "missing next command: $($finding.technique_id)" }
            if ($finding.what_next -notmatch 'stop' -or $finding.what_next -notmatch 'cleanup') { throw "incomplete operator handoff: $($finding.technique_id)" }
          }

          $evasion = & powershell.exe -NoProfile -File .\scripts\windows\evasion.ps1 -Technique amsi-bypass -Authorized -ConfirmEvasion -AllowTechniques amsi-bypass -Json | ConvertFrom-Json
          if ($evasion.feature -ne 'windows-evasion' -or $evasion.status -ne 'ready') { throw 'evasion feature/status mismatch' }
          $evasionRejected = Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile', '-File', '.\scripts\windows\evasion.ps1', '-Technique', 'amsi-bypass', '-Authorized', '-AllowTechniques', 'amsi-bypass', '-Json') -Wait -PassThru -NoNewWindow
          if ($evasionRejected.ExitCode -ne 1) { throw "evasion missing-confirmation exit mismatch: $($evasionRejected.ExitCode)" }

          $msbuildCommand = Get-Command msbuild.exe -ErrorAction SilentlyContinue
          if ($msbuildCommand) {
            $msbuild = $msbuildCommand.Source
          } else {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
              throw 'MSBuild fallback validation requires msbuild.exe or Visual Studio vswhere.exe'
            }
            $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
            if (-not $msbuild -or -not (Test-Path -LiteralPath $msbuild -PathType Leaf)) {
              throw 'Visual Studio installation does not expose a usable MSBuild.exe'
            }
          }
          $priorAuth = $env:STEALTHY_AUTHORIZED
          try {
            Remove-Item Env:STEALTHY_AUTHORIZED -ErrorAction SilentlyContinue
            $msbuildRejected = Start-Process -FilePath $msbuild -ArgumentList @('.\scripts\windows\EnumTasks.csproj', '/nologo', '/v:minimal', '/p:StealthyJson=true') -Wait -PassThru -NoNewWindow
            if ($msbuildRejected.ExitCode -eq 0) { throw 'MSBuild fallback accepted a missing authorization acknowledgment' }
            $env:STEALTHY_AUTHORIZED = '1'
            $msbuildOutput = & $msbuild .\scripts\windows\EnumTasks.csproj /nologo /v:minimal /p:StealthyJson=true
            if ($LASTEXITCODE -ne 0) { throw "MSBuild fallback failed with exit $LASTEXITCODE" }
            $msbuildJson = $msbuildOutput | Where-Object { $_ -match '^\s*\{' } | Select-Object -Last 1 | ConvertFrom-Json
            if ($msbuildJson.coverage_mode -ne 'script' -or $msbuildJson.identity.elevation_source -ne 'msbuild') { throw 'MSBuild fallback JSON contract mismatch' }
            if ($msbuildJson.started_at_unix -le 0) { throw 'MSBuild fallback timestamp contract mismatch' }
          } finally {
            if ($null -eq $priorAuth) { Remove-Item Env:STEALTHY_AUTHORIZED -ErrorAction SilentlyContinue } else { $env:STEALTHY_AUTHORIZED = $priorAuth }
          }

          Remove-Item -LiteralPath $root -Recurse -Force

  agents:
    name: Agent syntax checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: unix
          - os: windows-latest
            shell: windows
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check Bash / Python agent syntax
        if: matrix.shell == 'unix'
        shell: bash
        run: |
          find scripts/linux -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          bash -n scripts/install.sh
          python3 -m py_compile scripts/linux/enum.py scripts/ci/*.py scripts/release/*.py
          python3 scripts/linux/enum.py --authorized --json > /tmp/stealthy-script-report.json
          python3 -c 'import json; r=json.load(open("/tmp/stealthy-script-report.json")); assert r["schema_version"] == "2"; assert r["coverage_mode"] == "script"; assert r["plugins_run"]; assert len(r["capability_delta"]) == 6'
          python3 -c 'import contextlib,importlib.util,io,json; s=importlib.util.spec_from_file_location("stealthy_enum", "scripts/linux/enum.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.JSON_MODE=True; m.PLUGINS_RUN.append("linux.test"); m.record_coverage_error("linux.test", "fixture", PermissionError("denied")); out=io.StringIO(); c=contextlib.redirect_stdout(out); c.__enter__(); m.emit_json(); c.__exit__(None,None,None); r=json.loads(out.getvalue()); e=r["coverage"][0]; assert e["status"] == "partial" and e["error"] == "fixture: PermissionError"'
          bash scripts/linux/enum.sh --authorized --json > /tmp/stealthy-shell-report.json
          python3 -c 'import json; r=json.load(open("/tmp/stealthy-shell-report.json")); assert r["schema_version"] == "2"; assert r["coverage_mode"] == "script"'

      - name: Check PowerShell agent syntax
        if: matrix.shell == 'windows'
        shell: pwsh
        run: |
          $scripts = @(
            Get-ChildItem -Path scripts\windows -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue
            Get-Item scripts\install.ps1
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Lint PowerShell agents
        if: matrix.shell == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          $findings = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning,Error)
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }

      - name: Validate Windows authorization contract
        shell: pwsh
        run: python scripts/ci/validate_windows_contract.py

  security:
    name: Security and supply-chain checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full history for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Check dependency advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

      - name: Check for risky executable payload files
        shell: python
        run: |
          from pathlib import Path
          import sys

          blocked = {'.exe', '.dll', '.so', '.dylib', '.bin'}
          generated = {'.git', '.github', 'target'}
          findings = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in generated for part in path.parts):
                  continue
              if path.suffix.lower() in blocked:
                  findings.append(str(path))
          if findings:
              print('Unexpected executable payload files:', *findings, sep='\n')
              sys.exit(1)
          print('No executable payload files found')

      - name: Check repository hygiene
        run: python3 scripts/ci/validate_worktree_hygiene.py

      - name: Validate disposable release package
        run: python3 scripts/ci/validate_release_package.py

  user-readiness:
    name: User readiness validation
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Build release binary
        run: cargo build --locked -p stealthy --release

      - name: User readiness validation
        if: runner.os != 'Windows'
        run: |
          python3 scripts/ci/validate_user_readiness.py \
            ./target/release/stealthy --repo-root . --strict-warnings \
            --report user-readiness-${{ matrix.os }}.json

      - name: User readiness validation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci/validate_user_readiness.py `
            ./target/release/stealthy.exe --repo-root . --strict-warnings `
            --report user-readiness-${{ matrix.os }}.json

      - name: Phase 5 user acceptance validation
        if: runner.os != 'Windows'
        run: |
          python3 scripts/ci/validate_uat.py \
            ./target/release/stealthy --repo-root . \
            --report phase5-uat-${{ matrix.os }}.json

      - name: Phase 5 user acceptance validation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci/validate_uat.py `
            ./target/release/stealthy.exe --repo-root . `
            --report phase5-uat-${{ matrix.os }}.json

      - name: Upload user-readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: user-readiness-${{ matrix.os }}
          path: |
            user-readiness-${{ matrix.os }}.json
            phase5-uat-${{ matrix.os }}.json
          if-no-files-found: warn
          retention-days: 14

  production-readiness:
    name: CI readiness gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [docs, rust, linux-distributions, rust-windows, ux, coverage, agents, security, user-readiness]
    timeout-minutes: 5
    steps:
      - name: Enforce required CI gates
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          LINUX_DISTRIBUTIONS_RESULT: ${{ needs['linux-distributions'].result }}
          RUST_WINDOWS_RESULT: ${{ needs['rust-windows'].result }}
          UX_RESULT: ${{ needs.ux.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          AGENTS_RESULT: ${{ needs.agents.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          USER_READINESS_RESULT: ${{ needs['user-readiness'].result }}
        shell: bash
        run: |
          failed=()
          {
            printf '## CI readiness\n\n'
            printf '| Gate | Result |\n| --- | --- |\n'
          } >> "$GITHUB_STEP_SUMMARY"
          for gate in DOCS RUST LINUX_DISTRIBUTIONS RUST_WINDOWS UX COVERAGE AGENTS SECURITY USER_READINESS; do
            variable="${gate}_RESULT"
            result="${!variable}"
            printf '| %s | %s |\n' "$gate" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failed+=("$gate=$result")
            fi
          done
          if (( ${#failed[@]} )); then
            printf 'CI gates failed: %s\n' "${failed[*]}"
            exit 1
          fi
          echo 'All CI gates passed.'
