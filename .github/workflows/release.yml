name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stealthy-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: stealthy-windows-x86_64.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Build release binary
        run: cargo build --locked --workspace --release
      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "${{ matrix.artifact }}" -C target/release stealthy
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/stealthy.exe -DestinationPath "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          path: dist
      - name: Flatten artifacts and create checksums
        shell: bash
        run: |
          flattened="$(mktemp -d)"
          find dist -mindepth 2 -type f -exec cp {} "$flattened"/ \;
          find dist -mindepth 2 -type f -delete
          find dist -depth -mindepth 1 -type d -empty -delete
          cp "$flattened"/* dist/
          rm -rf "$flattened"
          test -f dist/stealthy-linux-x86_64.tar.gz
          test -f dist/stealthy-windows-x86_64.zip
          sha256sum dist/* > dist/SHA256SUMS
      - name: Attest Linux release artifact
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/stealthy-linux-x86_64.tar.gz
      - name: Attest Windows release artifact
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/stealthy-windows-x86_64.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
