[package]
name = "stealthy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Stealthy modular privilege-escalation enumerator for authorized assessments"
readme = "../../README.md"

[[bin]]
name = "stealthy"
path = "src/main.rs"

[features]
default = ["full"]
full = []
# Disables reversible probes, technique opt-ins, and executable control fixtures.
enum-only = []
# Constrained marker: this may only remove non-semantic diagnostic strings. It
# must retain authorization gates, safety disclaimers, and report/audit fields.
opsec-string-strip = ["enum-only"]

[package.metadata.stealthy.build-flavors.enum-only]
profile = "enum-only"
feature = "enum-only"
implementation = "runtime-gated"
must_preserve = ["authorization-gates", "safety-disclaimers", "audit-fields"]

[package.metadata.stealthy.build-flavors.opsec-string-strip]
profile = "opsec-string-strip"
feature = "opsec-string-strip"
implementation = "operator-hint-strings-stripped"
allowed_scope = "non-semantic diagnostic strings only"
must_preserve = ["authorization-gates", "safety-disclaimers", "audit-fields"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
ctrlc.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_NetManagement",
] }

[dev-dependencies]
tempfile = "3"
